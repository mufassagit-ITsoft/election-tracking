services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    user: "1000:1000"
    environment: [HOME=/tmp]
    volumes: [./data:/data]
  poller:            # always on: early-vote numbers + election-night results into SQLite
    build: .
    command: python manage.py run_poller
    env_file: .env
    user: "1000:1000"
    environment: [HOME=/tmp]
    volumes: [./data:/data]
    depends_on: [web]
    restart: unless-stopped
